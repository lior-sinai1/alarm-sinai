# Reverse proxy behind a single ngrok domain.
#
#   ngrok (https://demystify-unplug-sassy.ngrok-free.dev)
#     -> nginx 127.0.0.1:8080
#          /alarm/*  -> alarm server   127.0.0.1:3000  (prefix stripped)
#          everything else -> Home Assistant 127.0.0.1:8123
#
# Install:  sudo cp alarm-sinai.conf /etc/nginx/conf.d/alarm-sinai.conf
#           sudo nginx -t && sudo systemctl reload nginx
#
# conf.d/*.conf is included inside http { }, so map and server blocks are valid here.

# WebSocket upgrade for Home Assistant (/api/websocket).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ngrok terminates TLS and sends X-Forwarded-Proto: https. Fall back to $scheme
# when nginx is reached directly (e.g. curl from the LAN).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    # Loopback only: the ngrok agent runs on this machine, nothing else needs to reach it.
    listen 127.0.0.1:8080;
    server_name _;

    # Headers are set once at server level. Do not add proxy_set_header inside a
    # location below, or nginx stops inheriting all of these for that location.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    client_max_body_size 50m;

    # ── Alarm server ─────────────────────────────────────────────────────────
    # The trailing slash on proxy_pass replaces the /alarm/ prefix with /,
    # so /alarm/status reaches server.js as /status. Authentication (X-API-Key)
    # is enforced by server.js itself; nginx forwards the header untouched.
    location /alarm/ {
        proxy_pass         http://127.0.0.1:3000/;
        proxy_read_timeout 30s;
    }

    # ── Home Assistant (everything else) ─────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8123;
        proxy_buffering    off;
        # Long-lived WebSocket connections.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
